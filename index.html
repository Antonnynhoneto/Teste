<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Portfólio Fotográfico</title>
  <style>
    body {
      background: #111;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #flipbook {
      width: 800px;
      height: 500px;
    }
    .page {
      width: 400px;
      height: 500px;
      background-size: cover;
      background-position: center;
    }
  </style>
</head>
<body>
  <div id="flipbook">
    <div class="page" style="background-image: url('images/foto1.jpg');"></div>
    <div class="page" style="background-image: url('images/foto2.jpg');"></div>
    <div class="page" style="background-image: url('images/foto3.jpg');"></div>
    <div class="page" style="background-image: url('images/foto4.jpg');"></div>
  </div>

  <script src="jquery.min.js"></script>
  <script src="turn.min.js"></script>
  <script>
    $(document).ready(function () {
      $('#flipbook').turn({
        width: 800,
        height: 500,
        autoCenter: true
      });
    });
  </script>
</body>
</html>
